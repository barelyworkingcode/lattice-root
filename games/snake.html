<!DOCTYPE html>
<!-- made-with: Claude Code (Opus 4.8) -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --grid: #1c232d;
    --snake: #3fb950;
    --snake-head: #56d364;
    --food: #f85149;
    --bonus: #58a6ff;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(1200px 600px at 50% -10%, #11212e, var(--bg));
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    width: min(92vw, 520px);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  h1 {
    font-size: 26px;
    letter-spacing: 4px;
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(63,185,80,.35);
  }
  h1 small { color: var(--muted); font-size: 11px; letter-spacing: 2px; }
  .hud {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .hud .cell {
    background: var(--panel);
    border: 1px solid #21262d;
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
  }
  .hud .label { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .hud .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .stage {
    position: relative;
    background: var(--panel);
    border: 1px solid #21262d;
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px;
    background: var(--bg);
    image-rendering: pixelated;
  }
  .overlay {
    position: absolute;
    inset: 12px;
    border-radius: 8px;
    background: rgba(5, 8, 12, .82);
    backdrop-filter: blur(3px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 20px;
    transition: opacity .18s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { font-size: 30px; letter-spacing: 2px; }
  .overlay p { color: var(--muted); font-size: 13px; line-height: 1.6; max-width: 320px; }
  .overlay .big { color: var(--food); }
  kbd {
    background: #21262d;
    border: 1px solid #30363d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 12px;
    color: var(--text);
  }
  .btn {
    margin-top: 4px;
    background: var(--accent);
    color: #04130a;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(63,185,80,.35);
  }
  .btn:hover { filter: brightness(1.08); }
  footer { text-align: center; color: var(--muted); font-size: 11px; letter-spacing: 1px; }
  .legend { display: inline-flex; gap: 14px; align-items: center; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>SNAKE <small>lattice</small></h1>
      <div class="legend">
        <span><i class="dot" style="background:var(--food)"></i>food</span>
        <span><i class="dot" style="background:var(--bonus)"></i>bonus</span>
      </div>
    </header>

    <div class="hud">
      <div class="cell"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="cell"><div class="label">Best</div><div class="value" id="best">0</div></div>
      <div class="cell"><div class="label">Speed</div><div class="value" id="speed">1.0×</div></div>
    </div>

    <div class="stage">
      <canvas id="board" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">SNAKE</h2>
        <p id="ovText">
          Eat the <b style="color:var(--food)">red</b> food to grow. Grab the occasional
          <b style="color:var(--bonus)">blue</b> bonus for extra points.<br>
          Move with <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>.
          <kbd>Space</kbd>/<kbd>P</kbd> pauses.
        </p>
        <button class="btn" id="startBtn">PLAY</button>
      </div>
    </div>

    <footer>arrow / WASD to move · space or P to pause · made with Claude Code (Opus 4.8)</footer>
  </div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const GRID = 20;                       // 20x20 cells
  const CELL = canvas.width / GRID;      // px per cell
  const scoreEl = document.getElementById("score");
  const bestEl  = document.getElementById("best");
  const speedEl = document.getElementById("speed");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovText  = document.getElementById("ovText");
  const startBtn = document.getElementById("startBtn");

  const BASE_MS = 130;                   // tick interval at speed 1
  let snake, dir, nextDir, food, bonus, bonusTtl, score, best, alive, running, tickMs, acc, last, started;

  best = +(localStorage.getItem("lattice-snake-best") || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    tickMs = BASE_MS;
    bonus = null;
    bonusTtl = 0;
    alive = true;
    acc = 0;
    spawnFood();
    updateHud();
  }

  function cellFree(x, y) {
    return !snake.some(s => s.x === x && s.y === y) &&
           !(bonus && bonus.x === x && bonus.y === y) &&
           !(food && food.x === x && food.y === y);
  }

  function randCell() {
    let x, y, guard = 0;
    do { x = (Math.random() * GRID) | 0; y = (Math.random() * GRID) | 0; guard++; }
    while (!cellFree(x, y) && guard < 500);
    return {x, y};
  }

  function spawnFood() { food = randCell(); }

  function maybeSpawnBonus() {
    if (!bonus && Math.random() < 0.12) {
      bonus = randCell();
      bonusTtl = 45;                     // ticks before it vanishes
    }
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    speedEl.textContent = (BASE_MS / tickMs).toFixed(1) + "×";
  }

  function step() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // wall or self collision => death
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return die();
    }

    snake.unshift(head);

    let grew = false;
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      grew = true;
      spawnFood();
      maybeSpawnBonus();
      if (tickMs > 60) tickMs -= 4;      // speed up as you grow
    } else if (bonus && head.x === bonus.x && head.y === bonus.y) {
      score += 30;
      grew = true;                       // bonus also grows the snake
      bonus = null;
    }

    if (!grew) snake.pop();

    if (bonus && --bonusTtl <= 0) bonus = null;

    if (score > best) { best = score; localStorage.setItem("lattice-snake-best", best); }
    updateHud();
  }

  function die() {
    alive = false;
    running = false;
    ovTitle.innerHTML = 'GAME <span class="big">OVER</span>';
    ovText.innerHTML = "Score <b>" + score + "</b> · Best <b>" + best + "</b><br>" +
                       "Press <kbd>Space</kbd> or PLAY to try again.";
    startBtn.textContent = "PLAY AGAIN";
    overlay.classList.remove("hidden");
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    // background grid
    ctx.fillStyle = "#0d1117";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#1c232d";
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    // food (red)
    drawCell(food.x, food.y, "#f85149", true);

    // bonus (blue), blink when about to expire
    if (bonus && (bonusTtl > 12 || (bonusTtl & 1))) {
      drawCell(bonus.x, bonus.y, "#58a6ff", true);
    }

    // snake
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      drawCell(s.x, s.y, i === 0 ? "#56d364" : "#3fb950", false);
    }
  }

  function drawCell(cx, cy, color, round) {
    const pad = 2;
    const x = cx * CELL + pad, y = cy * CELL + pad, sz = CELL - pad * 2;
    ctx.fillStyle = color;
    if (round) {
      ctx.beginPath();
      ctx.arc(cx * CELL + CELL / 2, cy * CELL + CELL / 2, sz / 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      roundRect(x, y, sz, sz, 4);
      ctx.fill();
    }
  }

  function loop(ts) {
    if (!running) return;
    if (!last) last = ts;
    acc += ts - last;
    last = ts;
    while (acc >= tickMs) { step(); acc -= tickMs; if (!alive) break; }
    if (alive) { draw(); requestAnimationFrame(loop); }
  }

  function startGame() {
    reset();
    started = true;
    running = true;
    last = 0;
    overlay.classList.add("hidden");
    requestAnimationFrame(loop);
  }

  function togglePause() {
    if (!started || !alive) return;
    if (running) {
      running = false;
      ovTitle.textContent = "PAUSED";
      ovText.innerHTML = "Press <kbd>Space</kbd> / <kbd>P</kbd> or PLAY to resume.";
      startBtn.textContent = "RESUME";
      overlay.classList.remove("hidden");
    } else {
      running = true;
      last = 0;
      overlay.classList.add("hidden");
      requestAnimationFrame(loop);
    }
  }

  const OPP = (a, b) => a.x === -b.x && a.y === -b.y;
  function setDir(nx, ny) {
    const nd = {x: nx, y: ny};
    if (!OPP(nd, dir)) nextDir = nd;     // can't reverse into yourself
  }

  document.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()) ||
        ["w","a","s","d","p"].includes(k)) e.preventDefault();
    if (k === "arrowup"    || k === "w") setDir(0, -1);
    else if (k === "arrowdown"  || k === "s") setDir(0, 1);
    else if (k === "arrowleft"  || k === "a") setDir(-1, 0);
    else if (k === "arrowright" || k === "d") setDir(1, 0);
    else if (k === " " || k === "p") {
      if (!started || !alive) startGame();
      else togglePause();
    }
  });

  startBtn.addEventListener("click", () => {
    if (!started || !alive) startGame();
    else togglePause();
  });

  // initial idle frame
  reset();
  draw();
})();
</script>
</body>
</html>
